name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
      - name: Repositoriyi Klonla
        uses: actions/checkout@v4

      - name: .NET SDK Kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Android Workload Kurulumu
        run: dotnet workload install android maui

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Projeyi Restor Et
        run: dotnet restore

      - name: APK Derle ve Yayınla
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1
          if ($csproj) {
              Write-Host "Bulunan Proje: $($csproj.FullName)"
              dotnet publish $csproj.FullName -c Release -f net9.0-android --no-restore -o ./publish-output
          } else {
              Write-Error ".csproj dosyası bulunamadı!"
              exit 1
          }

      - name: APK Dosyasını Çıktı Olarak Üret (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: BedrockPackStudio-Android-APK
          path: ./publish-output/*.apk
